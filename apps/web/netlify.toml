# Usado por um site de prévia separado com Package directory apps/web e base na raiz.
[build]
  command = "npm ci --prefix apps/web && node scripts/build-angular-preview.mjs"
  publish = "apps/web/dist/nos-web/browser"

[functions]
  directory = "apps/web/netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/account-notifications"
  to = "/.netlify/functions/account-notifications"
  status = 200
  force = true

[[redirects]]
  from = "/api/problem-report"
  to = "/.netlify/functions/problem-report"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-store"
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
